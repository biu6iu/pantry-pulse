name: verify

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci 
      - run: npx next typegen 
      - run: npx tsc --noEmit 
      - run: npm run lint 
      - run: npm run test
      - run: npm run build 