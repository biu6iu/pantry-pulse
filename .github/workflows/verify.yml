name: verify

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pantry_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pantry_pulse"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/pantry_pulse"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pantry_pulse"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci 
      - run: npx next typegen 
      - run: npx tsc --noEmit 
      - run: npm run lint 
      - run: npm run test
      - run: npm run build 